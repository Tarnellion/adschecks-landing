name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run on the same branch is worthless — cancel it.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, budgets, tests, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The suite tests a real production build served through wrangler, so
    # everything below runs against one build. Splitting this into separate
    # jobs would mean building the site three times.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        # Only chromium — playwright.config.js defines a single project.
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}

      - name: Budgets
        # Fast static gate — fails in ~1s rather than after the full suite.
        run: npm run budgets

      - name: Playwright
        run: npm test
        env:
          # webServer reuses this build instead of running astro build again.
          SKIP_BUILD: '1'

      - name: Lighthouse
        run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
